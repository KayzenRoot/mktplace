name: UI Foundation
on:
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'eslint.config.mjs'
      - '.github/workflows/ui-foundation.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ui-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct dependencies (lockfile pending)
        run: npm install --ignore-scripts --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Install Chromium for visual checks
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (desktop and mobile)
        run: npm run e2e
        env:
          CI: 'true'
      - name: Export visual evidence and dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wo-blg-001-visual-and-lock
          path: |
            artifacts/
            package-lock.json
          retention-days: 7
          if-no-files-found: warn
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
