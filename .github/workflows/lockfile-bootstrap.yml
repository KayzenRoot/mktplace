name: Bootstrap pg lockfile (temporary)
on:
  push:
    branches: [feat/WO-BLG-001-secure-oauth]
    paths: ['.github/workflows/lockfile-bootstrap.yml']
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == 'KayzenRoot/mktplace' && github.actor == 'KayzenRoot' && github.ref == 'refs/heads/feat/WO-BLG-001-secure-oauth'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/WO-BLG-001-secure-oauth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update and verify pinned lock
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Commit exact lock on feature branch
        run: |
          set -euo pipefail
          test -s package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(WO-BLG-001): lock pg dependencies'
          git push origin HEAD:refs/heads/feat/WO-BLG-001-secure-oauth
